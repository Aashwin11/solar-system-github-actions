name: Unit Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
jobs:

  unit-testing:
    name: unit testing
    # strategy:
    #   matrix:
    #     nodejs_version: [18,19,20]
    #     os: [ubuntu-latest, macos-latest]
    #     exclude:
    #        - nodejs_version: 18
    #          os: macos-latest
    # runs-on: ${{ matrix.os }}
    runs-on: ubuntu-latest
      

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup up Node- 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        
      - name:  Unit testing
        run: npm test

      - name: Upload artifact for archieve test
        uses: actions/upload-artifact@v7
        with:
          name: Mocha-test-result
          path: test-results.xml
          retention-days: 1

  code-coverage:
    name: code-coverage
    # strategy:
    #   matrix:
    #     nodejs_version: [18,19,20]
    #     os: [ubuntu-latest, macos-latest]
    #     exclude:
    #        - nodejs_version: 18
    #          os: macos-latest
    # runs-on: ${{ matrix.os }}
    runs-on: ubuntu-latest
      

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup up Node- 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        
      - name:  coverage testing
        continue-on-error: true
        run: npm run coverage

      - name: Upload artifact for archieve test
        uses: actions/upload-artifact@v7
        with:
          name: Code-coverage-test-result
          path: coverage
          retention-days: 1
